name: Deploy

# After CI passes on main: build the ARM image, push to ECR, and deploy to the server via
# SSM (ADR-005). AWS access is a short-lived OIDC role session; no AWS keys in GitHub.
# The role trusts only refs/heads/main: don't add a GitHub `environment:` here without
# updating its trust policy (an environment changes the OIDC subject claim).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false # never interrupt a deploy halfway

permissions:
  id-token: write # OIDC token for AWS
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      OPS_BUCKET: ${{ vars.OPS_BUCKET }}
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      API_HOST: ${{ vars.API_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Deploy
        run: GIT_SHA="$(git rev-parse --short=12 HEAD)" infra/scripts/deploy.sh
