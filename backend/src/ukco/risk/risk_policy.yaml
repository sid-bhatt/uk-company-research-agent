# KYB risk policy: thresholds, severities and points for every rule.
#
# ILLUSTRATIVE ONLY. A real compliance team sets these from its own risk appetite.
# The values are deliberately in config, not code: policy changes shouldn't need a
# deploy, and every report records the hash of the policy that produced it.

version: 4

# Points per severity. Risk score = sum of points over flags, capped at 100; a knockout
# flag (see company_status) sets it to 100 outright.
points:
  low: 5
  medium: 15
  high: 30

# Per flag type: points = severity points x weight (rounded); unlisted types weigh 1.
# Fitted on the development set dev-v1 only (400 companies; logistic regression on the
# flags, repeated 5-fold cross-validation AUC 0.67 vs 0.59 for v3), then rounded. The
# held-out test set played no part. evals/README.md has the method and the numbers.
#
# Rules the outcome label can't measure keep weight 1: officer_network, the live register
# markers and new_company_high_risk_sic (back-tests can't see them, or no eval company was
# young enough to trigger them). Office changes, net liabilities and financial
# deterioration showed no link to failure within 18 months, but they bear on fraud and
# money-laundering risk that the label doesn't measure, so they keep a floor of 0.3
# (still shown in full, scored lightly).
score_weights:
  overdue_confirmation_statement: 2.2
  overdue_accounts: 1.6
  psc_changes: 1.1
  filing_history: 0.7
  director_churn: 0.4
  office_changes: 0.3
  net_liabilities: 0.3
  financial_deterioration: 0.3

rules:
  company_status:
    # Insolvent or closed: a KYB knockout, whatever else the report finds.
    # Live checks read the register status; back-tests use dated filings only.
    knockout_statuses: [liquidation, administration, receivership, insolvency-proceedings, voluntary-arrangement, dissolved, converted-closed, removed]
    knockout_filing_prefixes: [LIQ, AM, COCOMP, "4.", "2.", GAZ2]
    # Being struck off: the company applied to close (DS01) or Companies House proposed it
    # (GAZ1), and no later withdrawal (DS02) was filed. Serious, but not a knockout.
    strike_off_filing_prefixes: [DS01, GAZ1]
    strike_off_withdrawal_prefixes: [DS02]
    strike_off_window_months: 12
    strike_off_severity: high

  overdue_accounts:
    # Severity by days past the filing deadline.
    severity_by_days_overdue:
      - {min_days: 1, severity: medium}
      - {min_days: 90, severity: high}

  overdue_confirmation_statement:
    severity_by_days_overdue:
      - {min_days: 1, severity: low}
      - {min_days: 60, severity: medium}

  filing_history:
    # Accounts or confirmation statements filed after their deadline, not just overdue today.
    # A habit of filing late was the strongest signal missing from v3 (dev-v1 analysis).
    # 24 months beat 36 and "ever" on dev-v1; a 7-day grace period lost signal (filings a
    # few days late are still late, and Companies House fines them).
    window_months: 24
    grace_days: 0
    severity_by_late_filings:
      - {min_late: 1, severity: low}
      - {min_late: 2, severity: medium}
      - {min_late: 4, severity: high}

  director_churn:
    # v4: 24 months from 1 change (v3: 12 months from 3). Any change in the board is
    # worth a reviewer's look; the low weight above keeps a single change cheap.
    window_months: 24
    # Director appointments + resignations in the window, excluding the initial board
    # set up within `ignore_days_after_incorporation` of incorporation.
    ignore_days_after_incorporation: 30
    severity_by_changes:
      - {min_changes: 1, severity: low}
      - {min_changes: 3, severity: medium}
      - {min_changes: 5, severity: high}

  psc_changes:
    window_months: 12
    ignore_days_after_incorporation: 30
    severity_by_changes:
      - {min_changes: 1, severity: low}
      - {min_changes: 3, severity: medium}

  office_changes:
    window_months: 24
    severity_by_changes:
      - {min_changes: 2, severity: low}
      - {min_changes: 3, severity: medium}
    # Live-only register markers (not dated, so not used when back-testing).
    disputed_or_undeliverable_severity: high

  new_company_high_risk_sic:
    max_age_months: 12
    severity: medium

  officer_network:
    # Per officer: companies they are/were on, excluding this one. "Dissolved" is often a
    # benign voluntary strike-off, so it needs volume *and* a high share; insolvency
    # statuses count on their own.
    min_adverse_links: 5
    min_adverse_share: 0.5
    min_insolvency_links: 2
    adverse_statuses: [dissolved, liquidation, administration, receivership, insolvency-proceedings, voluntary-arrangement, converted-closed]
    insolvency_statuses: [liquidation, administration, receivership, insolvency-proceedings, voluntary-arrangement]
    severity: medium
    severity_if_insolvency_links: high

  financial_deterioration:
    # Compares the two most recent year-ends in filed iXBRL accounts (each filing also
    # carries the prior year's comparatives). Micro-entity accounts rarely report cash,
    # so net assets and net current assets carry most of the signal.
    drop_metrics: [net_assets, net_current_assets, current_assets, cash]
    min_drop_share: 0.5       # fell by at least half …
    min_prior_value: 10000    # … from a base of at least £10k (ignore tiny-base swings)
    drop_severity: medium
    net_liabilities_severity: medium   # liabilities exceed assets
    turned_negative_severity: high     # net assets went from positive to negative

  financial_substance:
    # A note, never a flag: tiny net assets (e.g. £100 of share capital) or dormant accounts
    # are normal for dormant, holding and owner-managed companies, so this adds no points.
    # It asks the reviewer to check the business really trades as the customer says.
    # Becomes a scored rule only if the eval shows it predicts adverse outcomes.
    max_net_assets: 1000     # net assets at or below this (and not negative) …
    note_dormant: true       # … or the latest accounts were filed as dormant

# Higher-risk sectors for financial crime, loosely following the UK National Risk
# Assessment of money laundering. SIC 2007 codes.
high_risk_sic_codes:
  "64999": Financial intermediation not elsewhere classified (incl. money service businesses)
  "66120": Security and commodity contracts dealing
  "66190": Activities auxiliary to financial services (incl. crypto-asset firms)
  "92000": Gambling and betting activities
  "45112": Sale of used cars and light motor vehicles (cash-intensive)
  "46720": Wholesale of metals and metal ores
  "47770": Retail sale of watches and jewellery
  "68100": Buying and selling of own real estate
  "68310": Real estate agencies
  "82990": Other business support service activities n.e.c. (incl. company formation / TCSPs)
  "74990": Non-trading company
  "99999": Dormant company
