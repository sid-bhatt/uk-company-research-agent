[project]
name = "ukco"
version = "0.1.0"
description = "UK Company Research Agent: Companies House data + filings, retrieval, and a tool-calling agent with cited answers."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "typer>=0.12",
    "httpx>=0.28.1",
    "sqlalchemy>=2.0",
    "alembic>=1.20.0",
    "pyyaml>=6.0.3",
    "anthropic>=1.10.0",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "mcp>=2.2.0",
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "pyjwt>=2.15.1",
]

[project.scripts]
ukco = "ukco.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ukco"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs a running Postgres (docker compose up db)"]
