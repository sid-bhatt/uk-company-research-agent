services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ukco
      POSTGRES_PASSWORD: ukco
      POSTGRES_DB: ukco
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ukco -d ukco"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
